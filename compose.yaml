# Instalação do Regents (Spec, módulo 13; ADRs 0007 e 0008).
#
# Quem chega: um peer da tailnet abre https://<TS_HOSTNAME>.<tailnet>.ts.net. O Tailscale Serve,
# no sidecar, termina o HTTPS, limpa e reescreve os headers de identidade e faz proxy para
# http://app:3000. O app pergunta ao tailscaled (whois, pelo socket) de quem é o IP.
#
# Regras que não se negociam (o desvio de headers depende delas):
# - Nenhum serviço tem `ports:`. O único caminho até o app é o Serve.
# - A rede `interna` tem só tailscale, app, postgres e backup. Nenhum
#   docker-compose.override.yml pode ligar outro serviço a ela: qualquer container ali
#   fala com app:3000 e forja X-Forwarded-For.
# - O sidecar fica em userspace, sem /dev/net/tun e sem capabilities.
#
# Configuração do Admin só no .env (o setup o escreve); segredos em ./secrets (deploy/setup.sh).
# O hostname (TS_HOSTNAME), a tag da tailnet (REGENTS_TAILNET_TAG) e o papel e o banco do Postgres
# (REGENTS_POSTGRES_USER, REGENTS_POSTGRES_DB) vêm do .env, com `regents` como padrão: uma
# Instalação que era Shearim guarda os de antes, porque trocá-los muda a URL e a identidade do nó.
# Atualizar: `sh deploy/update.sh` (baixa o compose da release e roda `docker compose pull &&
# docker compose up -d`). Na subida, o app faz um dump em ./backups antes de migrar; uma versão
# mais velha não sobe num banco migrado por uma mais nova (voltar de versão é
# `docker compose run --rm app restore <dump de antes da migração>`).
# Backup completo: ./backups (um pg_dump por noite, 14 dias) mais ./secrets. Guarde os dois fora daqui.

name: regents

services:
  tailscale:
    # >= 1.104.4 (boletins TS-2026-016 e TS-2026-017). Fixado por tag e digest.
    image: tailscale/tailscale:v1.104.7@sha256:72c1e19e0aedca96b8533bbb0b4368564410ff20b17e53b804eb6c1f04a31be4
    hostname: ${TS_HOSTNAME:-regents}
    environment:
      TS_AUTHKEY: file:/run/secrets/ts_authkey
      # O nó é tag:regents (por padrão): o que sai da Instalação não herda a identidade de quem criou a chave.
      TS_EXTRA_ARGS: --advertise-tags=${REGENTS_TAILNET_TAG:-tag:regents}
      TS_HOSTNAME: ${TS_HOSTNAME:-regents}
      TS_USERSPACE: "true"
      TS_AUTH_ONCE: "true"
      TS_STATE_DIR: /var/lib/tailscale
      TS_SOCKET: /var/run/tailscale/tailscaled.sock
      TS_SERVE_CONFIG: /config/serve.json
      # /healthz no loopback do sidecar. Um peer alcança essa porta pelo netstack: ali não pode
      # haver nada com segredo (ADR 0008).
      TS_ENABLE_HEALTH_CHECK: "true"
      TS_LOCAL_ADDR_PORT: 127.0.0.1:9002
    secrets:
      - ts_authkey
    volumes:
      - ts-state:/var/lib/tailscale
      - ts-socket:/var/run/tailscale
      # O diretório (não o arquivo): o containerboot recarrega o serve.json quando ele muda.
      - ./deploy/tailscale:/config:ro
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [interna]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9002/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped

  app:
    image: ${REGENTS_IMAGE:-ghcr.io/rfl-designer/regents}:${REGENTS_VERSION:-local}
    build: .
    init: true
    environment:
      REGENTS_IDENTITY: tailnet
      TS_SOCKET: /var/run/tailscale/tailscaled.sock
      DATABASE_URL: postgres://${REGENTS_POSTGRES_USER:-regents}@postgres:5432/${REGENTS_POSTGRES_DB:-regents}
      DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      # Cifra a Chave do Workspace no banco (Contas e Chave). Sem ela, um dump não basta.
      REGENTS_MASTER_KEY_FILE: /run/secrets/master_key
      # `sub` do VAPID (Push). Precisa de domínio real: a Apple recusa localhost. A falta dela é o
      # que para o updater antigo de uma Instalação Shearim (o `.env` dela tem SHEARIM_VAPID_CONTACT):
      # o `docker compose config -q` dele falha, ele volta o compose de antes e mostra esta mensagem.
      # `~/shearim` é a pasta padrão das Instalações Shearim. Sem `}`, `: ` nem ` #` na mensagem.
      REGENTS_VAPID_CONTACT: ${REGENTS_VAPID_CONTACT:?rode o instalador novo com --update (veja o README), na pasta da Instalação, como em curl -fsSL https://github.com/rfl-designer/regents/releases/latest/download/install.sh | sh -s -- --update --dir ~/shearim}
      # Pasta-raiz das Contas: o volume `contas` abaixo.
      REGENTS_ACCOUNTS_DIR: /data/contas
      # A versão na seção Instalação: a mesma tag da imagem.
      REGENTS_VERSION: ${REGENTS_VERSION:-local}
      # O dump de antes de migrar e o `restore <arquivo>` (que acha o arquivo pelo nome aqui).
      REGENTS_BACKUPS_DIR: /backups
      # Tetos de concorrência das execuções, ajustáveis no `.env` (vazio: 2 por Conta, 4 na Chave,
      # 8 processos `claude -p` no host).
      REGENTS_MAX_PER_ACCOUNT: ${REGENTS_MAX_PER_ACCOUNT:-}
      REGENTS_MAX_ON_KEY: ${REGENTS_MAX_ON_KEY:-}
      REGENTS_MAX_PROCESSES: ${REGENTS_MAX_PROCESSES:-}
      REGENTS_TOOL_TIMEOUT_S: ${REGENTS_TOOL_TIMEOUT_S:-}
      REGENTS_TOOL_MAX_TURNS: ${REGENTS_TOOL_MAX_TURNS:-}
      REGENTS_APPROVAL_TTL_H: ${REGENTS_APPROVAL_TTL_H:-}
      REGENTS_MEMORY_MODEL: ${REGENTS_MEMORY_MODEL:-}
      REGENTS_MEMORY_SUMMARY_CHARS: ${REGENTS_MEMORY_SUMMARY_CHARS:-}
      REGENTS_WIKI_SOURCE_MAX_MB: ${REGENTS_WIKI_SOURCE_MAX_MB:-}
      REGENTS_WIKI_PART_MAX_CHARS: ${REGENTS_WIKI_PART_MAX_CHARS:-}
      REGENTS_WIKI_SYNC_MAX_TURNS: ${REGENTS_WIKI_SYNC_MAX_TURNS:-}
    secrets:
      - postgres_password
      - master_key
    volumes:
      # Só leitura; o app roda sem root, então a LocalAPI só lhe dá leitura (whois).
      - ts-socket:/var/run/tailscale:ro
      # CLAUDE_CONFIG_DIR de cada Membro (Contas). Fora do backup, de propósito.
      - contas:/data/contas
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [interna]
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - 'fetch("http://127.0.0.1:3000/api/health").then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))'
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    # Tempo para as execuções em andamento terminarem ou virarem falha "o servidor reiniciou".
    stop_grace_period: 30s
    restart: unless-stopped

  postgres:
    image: postgres:18.6-alpine@sha256:9ba53c7d41ea093baf5c1ba635ba5434c4f979880527d49bb7d9237d3193085b
    environment:
      POSTGRES_USER: ${REGENTS_POSTGRES_USER:-regents}
      POSTGRES_DB: ${REGENTS_POSTGRES_DB:-regents}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - pgdata:/var/lib/postgresql
    networks: [interna]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${REGENTS_POSTGRES_USER:-regents}", "-d", "${REGENTS_POSTGRES_DB:-regents}"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    stop_grace_period: 30s
    restart: unless-stopped

  # O pg_dump noturno em ./backups, com 14 dias de retenção. É a mesma imagem do app rodando
  # `backup`: grava cada tentativa no banco, e o app avisa o Admin (push e faixa) quando falha ou
  # passa 36 h sem um backup bom. Espera o app subir (é ele quem migra).
  backup:
    image: ${REGENTS_IMAGE:-ghcr.io/rfl-designer/regents}:${REGENTS_VERSION:-local}
    init: true
    command: ["backup"]
    environment:
      DATABASE_URL: postgres://${REGENTS_POSTGRES_USER:-regents}@postgres:5432/${REGENTS_POSTGRES_DB:-regents}
      DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      REGENTS_BACKUPS_DIR: /backups
      # HH:MM na hora local do container (TZ, padrão UTC).
      REGENTS_BACKUP_AT: ${REGENTS_BACKUP_AT:-03:00}
      TZ: ${TZ:-UTC}
    secrets:
      - postgres_password
    volumes:
      - ./backups:/backups
    depends_on:
      app:
        condition: service_healthy
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [interna]
    stop_grace_period: 30s
    restart: unless-stopped

networks:
  interna: {}

volumes:
  ts-state: {}
  ts-socket: {}
  pgdata: {}
  contas: {}

secrets:
  ts_authkey:
    file: ./secrets/ts_authkey
  postgres_password:
    file: ./secrets/postgres_password
  master_key:
    file: ./secrets/master_key
